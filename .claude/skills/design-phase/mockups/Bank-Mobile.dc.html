<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz bank, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12082e}
a{color:#c4b5fd;text-decoration:none}a:hover{color:#ffffff}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;letter-spacing:-0.01em;margin:0}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1200px; position: relative; overflow: hidden; box-sizing: border-box; background: #12082e; color: #ffffff; font-family: Inter, system-ui, sans-serif">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px">
    <h1 style="font-size: 28px; font-weight: 600; margin-right: auto">Quizzes</h1>
    <a href="#" aria-label="Mix a random quiz" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(34,211,238,0.14); border: 1px solid rgba(34,211,238,0.42); color: #67e8f9; display: flex; align-items: center; justify-content: center">
      <svg class="i" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/></svg>
    </a>
    <a href="#" aria-label="New quiz" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg class="i" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </a>
  </header>

  <main style="padding: 10px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <div role="tablist" style="display: flex; padding: 4px; gap: 2px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
      <button type="button" role="tab" aria-selected="false" style="flex: 1; height: 38px; border-radius: 9px; background: transparent; border: 0; color: rgba(255,255,255,0.72); font-weight: 500; font-size: 14px">Mine</button>
      <button type="button" role="tab" aria-selected="true" style="flex: 1; height: 38px; border-radius: 9px; background: rgba(255,255,255,0.14); border: 0; color: #ffffff; font-weight: 600; font-size: 14px">Bank</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 1; height: 38px; border-radius: 9px; background: transparent; border: 0; color: rgba(255,255,255,0.72); font-weight: 500; font-size: 14px">Packs</button>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.6)">
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Search 77 quizzes" aria-label="Search the quiz bank" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #ffffff; font: inherit; font-size: 15px">
    </label>

    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px" role="group" aria-label="Areas">
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="8">
        <button type="button" aria-pressed="{{a.pressed}}" style="{{a.style}}">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{a.color}}"></span>
          {{a.label}}
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.65)">
      <span>Geography · 4 quizzes</span>
      <button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; background: transparent; border: 1px solid rgba(255,255,255,0.14); color: #ffffff; font-size: 13px; font-weight: 500">
        <svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        All levels
      </button>
    </div>

    <sc-for list="{{quizzes}}" as="q" hint-placeholder-count="4">
      <article style="border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #22d3ee">{{q.levelLabel}} · 10 questions</span>
          <span style="display: flex; align-items: flex-end; gap: 3px" aria-hidden="true">
            <sc-for list="{{q.bars}}" as="b" hint-placeholder-count="3">
              <span style="width: 5px; height: {{b.h}}; border-radius: 2px; background: {{b.bg}}"></span>
            </sc-for>
          </span>
        </div>
        <h2 style="font-size: 18px; font-weight: 600; line-height: 1.25">{{q.title}}</h2>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.7)">{{q.desc}}</p>
        <div style="display: flex; gap: 8px; margin-top: 4px">
          <button type="button" style="flex: 1; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #ffffff; font-weight: 500; font-size: 14px">Preview</button>
          <button type="button" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 12px; background: #ff4d8d; border: 0; color: #ffffff; font-weight: 600; font-size: 14px">
            <svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            Present
          </button>
        </div>
      </article>
    </sc-for>
  </main>

  <!-- Bottom tab bar -->
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 22px; background: rgba(23,12,61,0.96); border-top: 1px solid rgba(255,255,255,0.10); display: flex; align-items: flex-end; justify-content: space-between">
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; min-height: 48px; color: rgba(255,255,255,0.65); font-size: 11px; font-weight: 500">
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="#" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; min-height: 48px; color: #ffffff; font-size: 11px; font-weight: 600">
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" style="color: #22d3ee" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      Quizzes
    </a>
    <a href="#" aria-label="Present" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #ffffff; font-size: 11px; font-weight: 600">
      <span style="width: 54px; height: 54px; margin-top: -26px; border-radius: 18px; background: #ff4d8d; border: 4px solid #170c3d; display: flex; align-items: center; justify-content: center">
        <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </span>
      Present
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; min-height: 48px; color: rgba(255,255,255,0.65); font-size: 11px; font-weight: 500">
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
      Games
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; min-height: 48px; color: rgba(255,255,255,0.65); font-size: 11px; font-weight: 500">
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v1H6a2 2 0 0 0-2 2v3h1a3 3 0 0 1 0 6H4v3a2 2 0 0 0 2 2h3v-1a3 3 0 0 1 6 0v1h3a2 2 0 0 0 2-2v-3h-1a3 3 0 0 1 0-6h1V8a2 2 0 0 0-2-2h-3V5a3 3 0 0 0-3-3z"/></svg>
      Puzzles
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const areaList = [
      ['All', '#ffffff'], ['Geography', '#22d3ee'], ['History', '#fbbf24'], ['Science', '#34d399'],
      ['Movies & TV', '#fb7185'], ['Music', '#ff7aa8'], ['Sports', '#a3e635'], ['Space', '#a78bfa']
    ];
    const areas = areaList.map(([label, color], i) => ({
      label, color, pressed: i === 1 ? 'true' : 'false',
      style: 'flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; font-weight: ' + (i === 1 ? '600' : '500') + '; color: #ffffff; ' +
        (i === 1 ? 'background: rgba(34,211,238,0.16); border: 1px solid rgba(34,211,238,0.50)' : 'background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12)')
    }));
    const levels = { easy: 1, medium: 2, hard: 3 };
    const raw = [
      ['Capital Cities', 'easy', 'Match the country to its capital in this friendly world tour.'],
      ['Peaks & Rivers', 'medium', 'From the Alps to the Amazon, test your knowledge of great rivers and mountains.'],
      ['Seas & Isles', 'medium', 'Dive into the world’s oceans, seas, straits and island nations.'],
      ['Borders & Neighbours', 'hard', 'Enclaves, landlocked nations and shared frontiers for true map lovers.']
    ];
    const quizzes = raw.map(([title, level, desc]) => ({
      title, desc,
      levelLabel: level.charAt(0).toUpperCase() + level.slice(1),
      bars: [7, 11, 15].map((h, i) => ({ h: h + 'px', bg: i < levels[level] ? '#22d3ee' : 'rgba(255,255,255,0.18)' }))
    }));
    return { areas, quizzes };
  }
}
</script>
</body>
</html>
