<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Presenter stage, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0c0522}
a{color:#c4b5fd;text-decoration:none}a:hover{color:#ffffff}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;letter-spacing:-0.01em;margin:0}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #0c0522; color: #ffffff; font-family: Inter, system-ui, sans-serif; padding: 28px 40px 28px; display: flex; flex-direction: column; gap: 28px">

  <!-- Top bar -->
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(120deg, #ff4d8d, #a855f7); display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 700; font-size: 18px">Q</span>
      <div>
        <div style="font-family: Outfit, sans-serif; font-weight: 600; font-size: 18px">Capital Cities</div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.65)">Geography · Easy</div>
      </div>
    </div>
    <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin: 0 auto">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75)"><span>Question 4 of 10</span><span>10 points</span></div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px" aria-label="Question 4 of 10">
        <span style="height: 6px; border-radius: 3px; background: #c084fc"></span>
        <span style="height: 6px; border-radius: 3px; background: #c084fc"></span>
        <span style="height: 6px; border-radius: 3px; background: #c084fc"></span>
        <span style="height: 6px; border-radius: 3px; background: #ff4d8d"></span>
        <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div role="img" aria-label="Timer stopped at 12 seconds" style="position: relative; width: 56px; height: 56px">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="transform: rotate(-90deg)"><circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/><circle cx="28" cy="28" r="24" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="90.5"/></svg>
        <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 18px; color: #fbbf24">12</span>
      </div>
      <button type="button" aria-label="Full screen" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; justify-content: center">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button type="button" aria-label="Exit stage" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; justify-content: center">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </header>

  <!-- Question -->
  <section style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; width: 100%; max-width: 1160px; margin: 0 auto">
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.40); color: #67e8f9; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">
      <svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      Multiple choice
    </span>
    <h1 style="font-size: 64px; line-height: 1.08; font-weight: 600; text-align: center; text-wrap: balance">What is the capital of Canada?</h1>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
      <div style="display: flex; align-items: center; gap: 18px; min-height: 92px; padding: 0 22px; border-radius: 18px; background: rgba(255,77,141,0.08); border: 2px solid rgba(255,77,141,0.24); opacity: 0.6">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(255,77,141,0.24); color: #ff7aa8; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 700; font-size: 24px">A</span>
        <span style="font-family: Outfit, sans-serif; font-size: 30px; font-weight: 500">Toronto</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px; min-height: 92px; padding: 0 22px; border-radius: 18px; background: #34d399; border: 2px solid #ffffff; color: #052e16">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: #052e16; color: #34d399; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 700; font-size: 24px">B</span>
        <span style="font-family: Outfit, sans-serif; font-size: 30px; font-weight: 600">Ottawa</span>
        <span style="margin-left: auto; width: 44px; height: 44px; border-radius: 22px; background: #052e16; color: #34d399; display: flex; align-items: center; justify-content: center" aria-label="Correct answer">
          <svg class="i" width="24" height="24" viewBox="0 0 24 24" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px; min-height: 92px; padding: 0 22px; border-radius: 18px; background: rgba(251,191,36,0.08); border: 2px solid rgba(251,191,36,0.24); opacity: 0.6">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(251,191,36,0.24); color: #fbbf24; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 700; font-size: 24px">C</span>
        <span style="font-family: Outfit, sans-serif; font-size: 30px; font-weight: 500">Vancouver</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px; min-height: 92px; padding: 0 22px; border-radius: 18px; background: rgba(163,230,53,0.08); border: 2px solid rgba(163,230,53,0.24); opacity: 0.6">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(163,230,53,0.24); color: #a3e635; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 700; font-size: 24px">D</span>
        <span style="font-family: Outfit, sans-serif; font-size: 30px; font-weight: 500">Montreal</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-radius: 14px; background: rgba(251,191,36,0.10); border: 1px solid rgba(251,191,36,0.36); max-width: 760px">
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" style="color: #fbbf24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      <span style="font-size: 18px; line-height: 1.45; color: rgba(255,255,255,0.88)">Queen Victoria chose Ottawa as the capital in 1857.</span>
    </div>
  </section>

  <!-- Scoreboard + controls -->
  <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08)">
    <div style="flex: 1 1 560px; display: flex; flex-wrap: wrap; gap: 12px">
      <div style="flex: 1 1 160px; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; border-radius: 14px; background: rgba(255,77,141,0.12); border: 1px solid rgba(255,77,141,0.40)">
        <span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 14px; color: #ff7aa8">1st</span>
        <span style="font-weight: 600; font-size: 16px">Team 1</span>
        <span style="margin-left: auto; font-family: Outfit, sans-serif; font-weight: 600; font-size: 26px">40</span>
        <span style="font-size: 12px; font-weight: 700; color: #052e16; background: #34d399; border-radius: 6px; padding: 2px 6px">+10</span>
      </div>
      <div style="flex: 1 1 160px; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10)">
        <span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 14px; color: #67e8f9">2nd</span>
        <span style="font-weight: 600; font-size: 16px">Team 2</span>
        <span style="margin-left: auto; font-family: Outfit, sans-serif; font-weight: 600; font-size: 26px">20</span>
      </div>
      <div style="flex: 1 1 160px; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10)">
        <span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 14px; color: #bef264">2nd</span>
        <span style="font-weight: 600; font-size: 16px">Team 3</span>
        <span style="margin-left: auto; font-family: Outfit, sans-serif; font-weight: 600; font-size: 26px">20</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #ffffff; font-weight: 500; font-size: 15px">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 14px; background: #ff4d8d; border: 0; color: #ffffff; font-weight: 600; font-size: 15px">
        Next question
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
