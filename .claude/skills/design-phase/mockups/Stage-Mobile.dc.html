<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host remote, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12082e}
a{color:#c4b5fd;text-decoration:none}a:hover{color:#ffffff}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;letter-spacing:-0.01em;margin:0}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; box-sizing: border-box; background: #12082e; color: #ffffff; font-family: Inter, system-ui, sans-serif">

  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px">
    <button type="button" aria-label="Leave host remote" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg class="i" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Host remote</div>
      <div style="font-size: 12px; color: rgba(255,255,255,0.65)">Capital Cities</div>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(52,211,153,0.14); border: 1px solid rgba(52,211,153,0.40); color: #6ee7b7; font-size: 12px; font-weight: 600">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: #34d399"></span>
      On stage
    </span>
  </header>

  <main style="padding: 6px 16px 120px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7)"><span>Question 4 of 10</span><span>10 points</span></div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px" aria-label="Question 4 of 10">
        <span style="height: 5px; border-radius: 3px; background: #c084fc"></span>
        <span style="height: 5px; border-radius: 3px; background: #c084fc"></span>
        <span style="height: 5px; border-radius: 3px; background: #c084fc"></span>
        <span style="height: 5px; border-radius: 3px; background: #ff4d8d"></span>
        <span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
        <span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14)"></span>
      </div>
    </div>

    <!-- Question preview -->
    <section style="border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <h1 style="font-size: 22px; line-height: 1.2; font-weight: 600">What is the capital of Canada?</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-size: 14px; display: flex; align-items: center; padding: 0 12px">A · Toronto</div>
        <div style="height: 40px; border-radius: 10px; background: #34d399; color: #052e16; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; padding: 0 12px">B · Ottawa <svg class="i" width="16" height="16" viewBox="0 0 24 24" stroke-width="3" style="margin-left: auto" aria-label="Correct"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div style="height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-size: 14px; display: flex; align-items: center; padding: 0 12px">C · Vancouver</div>
        <div style="height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-size: 14px; display: flex; align-items: center; padding: 0 12px">D · Montreal</div>
      </div>
      <div style="display: flex; gap: 8px; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.75)">
        <svg class="i" width="16" height="16" viewBox="0 0 24 24" style="color: #fbbf24; margin-top: 1px" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        Queen Victoria chose Ottawa as the capital in 1857.
      </div>
    </section>

    <!-- Stage controls -->
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 14px; border-radius: 16px; background: rgba(251,191,36,0.10); border: 1px solid rgba(251,191,36,0.38); color: #ffffff; text-align: left">
        <span role="img" aria-label="12 seconds left" style="position: relative; width: 40px; height: 40px">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="transform: rotate(-90deg)"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="60.3"/></svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 13px; color: #fbbf24">12</span>
        </span>
        <span>
          <span style="display: block; font-weight: 600; font-size: 14px">Pause timer</span>
          <span style="display: block; font-size: 12px; color: rgba(255,255,255,0.65)">of 30 seconds</span>
        </span>
      </button>
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 14px; border-radius: 16px; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.40); color: #ffffff; text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(52,211,153,0.20); color: #6ee7b7; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <span>
          <span style="display: block; font-weight: 600; font-size: 14px">Revealed</span>
          <span style="display: block; font-size: 12px; color: rgba(255,255,255,0.65)">Tap to hide</span>
        </span>
      </button>
    </section>

    <!-- Scoring -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="font-size: 17px; font-weight: 600">Award points</h2>
        <span style="font-size: 12px; color: rgba(255,255,255,0.65)">±10 per tap</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; background: rgba(255,77,141,0.10); border: 1px solid rgba(255,77,141,0.36)">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #ff4d8d"></span>
        <span style="flex: 1; font-weight: 600; font-size: 15px">Team 1</span>
        <button type="button" aria-label="Take 10 points from Team 1" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 0; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <span style="width: 40px; text-align: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 22px">40</span>
        <button type="button" aria-label="Give 10 points to Team 1" style="width: 44px; height: 44px; border-radius: 12px; background: #ff4d8d; border: 0; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10)">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #22d3ee"></span>
        <span style="flex: 1; font-weight: 600; font-size: 15px">Team 2</span>
        <button type="button" aria-label="Take 10 points from Team 2" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 0; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <span style="width: 40px; text-align: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 22px">20</span>
        <button type="button" aria-label="Give 10 points to Team 2" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.14); border: 0; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10)">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #a3e635"></span>
        <span style="flex: 1; font-weight: 600; font-size: 15px">Team 3</span>
        <button type="button" aria-label="Take 10 points from Team 3" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 0; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <span style="width: 40px; text-align: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 22px">20</span>
        <button type="button" aria-label="Give 10 points to Team 3" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.14); border: 0; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
    </section>
  </main>

  <!-- Bottom controls -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: rgba(23,12,61,0.96); border-top: 1px solid rgba(255,255,255,0.10); display: flex; gap: 10px">
    <button type="button" aria-label="Previous question" style="width: 56px; height: 54px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button type="button" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 14px; background: #ff4d8d; border: 0; color: #ffffff; font-weight: 600; font-size: 16px">
      Next question
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
