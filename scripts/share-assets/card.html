<!doctype html>
<!-- Link-preview card (1200×630). Rendered to public/og-image.png by render.mjs. -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
<style>
  :root { --ink: #12082e; --fg: #fff; --pink: #ff4d8d; --purple: #a855f7; --cyan: #22d3ee; --lime: #a3e635; --sun: #fbbf24; --mint: #34d399; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--fg); background: var(--ink);
    background-image:
      radial-gradient(ellipse 60% 70% at 8% 0%, color-mix(in srgb, var(--purple) 34%, transparent), transparent 70%),
      radial-gradient(ellipse 55% 60% at 100% 10%, color-mix(in srgb, var(--cyan) 20%, transparent), transparent 70%),
      radial-gradient(ellipse 70% 60% at 60% 115%, color-mix(in srgb, var(--pink) 26%, transparent), transparent 70%);
    display: flex; align-items: center; gap: 56px; padding: 0 64px 0 72px;
  }
  .display { font-family: Outfit, Inter, sans-serif; letter-spacing: -0.01em; }
  .grad { background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .left { flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 38px; }
  .tile { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; font: 700 38px/1 Outfit, sans-serif; box-shadow: 0 10px 30px color-mix(in srgb, var(--purple) 40%, transparent); }
  .word { font-weight: 600; font-size: 40px; }
  h1 { font-weight: 600; font-size: 60px; line-height: 1.04; margin-bottom: 22px; }
  .sub { font-size: 23px; line-height: 1.45; color: rgb(255 255 255 / 0.72); margin-bottom: 34px; max-width: 520px; }
  .features { display: grid; grid-template-columns: auto auto; gap: 12px 26px; justify-content: start; }
  .f { display: flex; align-items: center; gap: 11px; white-space: nowrap; font-size: 19px; font-weight: 500; color: rgb(255 255 255 / 0.88); }
  .badge { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  .badge svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Mini stage */
  .stage { width: 492px; flex: none; border-radius: 26px; padding: 26px; background: rgb(255 255 255 / 0.06); border: 1px solid rgb(255 255 255 / 0.12); box-shadow: 0 30px 70px rgb(0 0 0 / 0.35); }
  .top { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .ring { width: 64px; height: 64px; flex: none; position: relative; }
  .ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
  .ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 22px Outfit, sans-serif; color: var(--mint); }
  .q { font-weight: 600; font-size: 25px; line-height: 1.2; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .o { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 14px; border: 1px solid; font: 500 20px Outfit, sans-serif; }
  .l { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font: 600 18px Outfit, sans-serif; color: var(--ink); flex: none; }
  .o.right { background: var(--mint); border-color: #fff; color: var(--ink); box-shadow: 0 0 0 3px rgb(255 255 255 / 0.22); }
  .o.right .l { background: rgb(18 8 46 / 0.15); }
  .o.right .tick { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; background: rgb(18 8 46 / 0.15); display: flex; align-items: center; justify-content: center; }
  .o.right svg { width: 16px; height: 16px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .o.dim { opacity: 0.38; }
  .teams { display: flex; gap: 10px; align-items: center; }
  .t { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid; font-weight: 600; font-size: 17px; }
  .t b { font-family: Outfit, sans-serif; }
  .pts { margin-left: auto; font: 600 16px Outfit, sans-serif; color: var(--lime); }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><div class="tile display">Q</div><div class="word display"><span class="grad">Quiz</span>Club</div></div>
    <h1 class="display">Quiz time,<br />on the big screen.</h1>
    <p class="sub">Run quizzes and games in class, at work or with friends. Free, no sign-up.</p>
    <div class="features">
      <div class="f"><span class="badge" style="background: color-mix(in srgb, var(--cyan) 18%, transparent); color: var(--cyan)"><svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>72 ready-made quizzes</div>
      <div class="f"><span class="badge" style="background: color-mix(in srgb, var(--purple) 22%, transparent); color: #c084fc"><svg viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></span>AI quiz maker</div>
      <div class="f"><span class="badge" style="background: color-mix(in srgb, var(--lime) 18%, transparent); color: var(--lime)"><svg viewBox="0 0 24 24"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg></span>Word &amp; puzzle games</div>
      <div class="f"><span class="badge" style="background: color-mix(in srgb, var(--pink) 18%, transparent); color: var(--pink)"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></span>Teams &amp; live scores</div>
    </div>
  </div>

  <div class="stage">
    <div class="top">
      <div class="ring">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="rgb(255 255 255 / 0.12)" stroke-width="6"/><circle cx="32" cy="32" r="28" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="70"/></svg>
        <span>12</span>
      </div>
      <div class="q display">Which planet is known as the Red Planet?</div>
    </div>
    <div class="opts">
      <div class="o dim" style="background: color-mix(in srgb, var(--pink) 14%, transparent); border-color: color-mix(in srgb, var(--pink) 45%, transparent)"><span class="l" style="background: var(--pink)">A</span>Venus</div>
      <div class="o right"><span class="l">B</span>Mars<span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span></div>
      <div class="o dim" style="background: color-mix(in srgb, var(--cyan) 14%, transparent); border-color: color-mix(in srgb, var(--cyan) 45%, transparent)"><span class="l" style="background: var(--cyan)">C</span>Jupiter</div>
      <div class="o dim" style="background: color-mix(in srgb, var(--lime) 14%, transparent); border-color: color-mix(in srgb, var(--lime) 45%, transparent)"><span class="l" style="background: var(--lime)">D</span>Mercury</div>
    </div>
    <div class="teams">
      <span class="t" style="background: color-mix(in srgb, var(--pink) 16%, transparent); border-color: color-mix(in srgb, var(--pink) 55%, transparent)">🦉 Owls <b>40</b></span>
      <span class="t" style="background: color-mix(in srgb, var(--cyan) 16%, transparent); border-color: color-mix(in srgb, var(--cyan) 55%, transparent)">🦊 Foxes <b>30</b></span>
      <span class="pts">+10</span>
    </div>
  </div>
</body>
</html>
