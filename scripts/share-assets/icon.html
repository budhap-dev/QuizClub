<!doctype html>
<!--
  App icon, rendered at any size by render.mjs: icon.html?size=512&mode=tile|full|maskable
  tile     = rounded gradient tile on transparent (browser tabs, "any" manifest icon)
  full     = full-bleed square (Apple touch icon; iOS rounds the corners itself)
  maskable = full-bleed with the Q inside the 80% safe zone (Android adaptive icons)
-->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=block" rel="stylesheet" />
<style>
  * { margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  .i { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #ff4d8d, #a855f7); color: #fff; font-family: Outfit, sans-serif; font-weight: 700; line-height: 1; }
</style>
</head>
<body>
<div class="i" id="i">Q</div>
<script>
  const p = new URLSearchParams(location.search)
  const size = +(p.get('size') || 512)
  const mode = p.get('mode') || 'tile'
  const el = document.getElementById('i')
  document.documentElement.style.width = document.documentElement.style.height = size + 'px'
  el.style.width = el.style.height = size + 'px'
  el.style.borderRadius = mode === 'tile' ? size * 0.22 + 'px' : '0'
  el.style.fontSize = size * (mode === 'maskable' ? 0.46 : 0.6) + 'px'
  // Optical centring: the Q's tail drags it down, so lift the glyph slightly.
  el.style.paddingBottom = size * 0.03 + 'px'
</script>
</body>
</html>
